name: Daily ScareWire Videos

on:
  schedule:
    # 9:17 AM Pakistan time; keep the daily run away from the top of the hour.
    - cron: "17 4 * * *"
    # Recovery passes at 3:17 PM and 9:17 PM Pakistan time.
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scarewire-daily-publishing
  cancel-in-progress: false

jobs:
  make-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu espeak-ng
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u main.py 2>&1 | tee run.log
        shell: bash

      - name: Preserve logs and rendered videos for recovery
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scarewire-run-${{ github.run_id }}
          path: |
            run.log
            output/**/final.mp4
            output/**/thumb.jpg
          if-no-files-found: ignore
          retention-days: 7
      - name: Save topics
        if: always()
        run: |
          git config user.name "scarewire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f used_topics.json video_history.json
          if git diff --cached --quiet; then
            echo "No ScareWire history changes to save."
            exit 0
          fi
          git commit -m "Save ScareWire upload history [skip ci]"
          for attempt in 1 2 3; do
            if ! git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"; then
              echo "ScareWire history fetch attempt $attempt failed; retrying."
              sleep 2
              continue
            fi
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo "Could not rebase ScareWire history."
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "ScareWire history push attempt $attempt failed; retrying."
            sleep 2
          done
          echo "Could not save ScareWire upload history after 3 attempts."
          exit 1
