name: Daily ScareWire Videos

on:
  schedule:
    # 9:17 AM Pakistan time; keep the daily run away from the top of the hour.
    - cron: "17 4 * * *"
    # Recovery passes at 3:17 PM and 9:17 PM Pakistan time.
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scarewire-daily-publishing
  cancel-in-progress: false

jobs:
  make-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        timeout-minutes: 20
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-match DejaVuSans >/dev/null 2>&1 || ! command -v espeak-ng >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu espeak-ng; then
                exit 0
              fi
              if [[ "$attempt" -eq 3 ]]; then exit 1; fi
              sleep 10
            done
          fi
      - name: Install deps
        timeout-minutes: 20
        run: pip install --disable-pip-version-check --retries 5 --timeout 30 -r requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: timeout --signal=TERM --kill-after=60s 85m python -u main.py 2>&1 | tee run.log
        shell: bash

      - name: Preserve logs and rendered videos for recovery
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: scarewire-run-${{ github.run_id }}
          path: |
            run.log
            output/**/final.mp4
            output/**/thumb.jpg
          if-no-files-found: ignore
          retention-days: 7
      - name: Save topics
        if: always()
        run: |
          git config user.name "scarewire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f used_topics.json video_history.json
          if git diff --cached --quiet; then
            echo "No ScareWire history changes to save."
            exit 0
          fi
          git commit -m "Save ScareWire upload history [skip ci]"
          for attempt in 1 2 3; do
            if ! git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"; then
              echo "ScareWire history fetch attempt $attempt failed; retrying."
              sleep 2
              continue
            fi
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo "Could not rebase ScareWire history."
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "ScareWire history push attempt $attempt failed; retrying."
            sleep 2
          done
          echo "Could not save ScareWire upload history after 3 attempts."
          exit 1
